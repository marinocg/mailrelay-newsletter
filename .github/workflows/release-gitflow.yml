name: Release (GitFlow)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.4.2)"
        required: true
      release_notes:
        description: "Optional release notes"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop (full history)
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Composer install (dev tools)
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --quiet
          php -r "unlink('composer-setup.php');"
          php composer.phar install --no-interaction --no-progress

      - name: Install gettext (msgfmt)
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Lint + PHPCS + PHPStan + PHPUnit (gate)
        run: |
          find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l
          php vendor/bin/phpcs
          php vendor/bin/phpstan analyse
          php vendor/bin/phpunit --configuration phpunit.xml.dist

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          BRANCH="release/v${VERSION}"
          git checkout -b "$BRANCH"

      - name: Bump versions (plugin header + constants + readme.txt)
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
        run: |
          normalize_notes() {
            printf "%s\n" "$1" | sed "s/\r//g" | sed '/^[[:space:]]*$/d'
          }

          format_input_notes() {
            printf "%s\n" "$1" | sed "s/\r//g" | awk 'NF{ if ($0 ~ /^[-*]/) print $0; else print "- " $0 }'
          }

          NOTES_FROM_UNRELEASED=""
          NOTES_FROM_VERSION=""
          if [ -f CHANGELOG.md ]; then
            NOTES_FROM_UNRELEASED=$(awk '
              BEGIN{in_block=0}
              $0=="## Unreleased"{in_block=1; next}
              in_block==1 && /^## /{exit}
              in_block==1{print}
            ' CHANGELOG.md)

            NOTES_FROM_VERSION=$(awk -v ver="${VERSION}" '
              BEGIN{in_block=0}
              $0=="## " ver {in_block=1; next}
              in_block==1 && /^## /{exit}
              in_block==1{print}
            ' CHANGELOG.md)
          fi

          NOTES_FROM_UNRELEASED_CLEAN=$(normalize_notes "$NOTES_FROM_UNRELEASED")
          NOTES_FROM_VERSION_CLEAN=$(normalize_notes "$NOTES_FROM_VERSION")

          if [ -n "${RELEASE_NOTES_INPUT}" ]; then
            NOTES_FORMATTED=$(format_input_notes "$RELEASE_NOTES_INPUT")
          elif [ -n "$NOTES_FROM_UNRELEASED_CLEAN" ] && [ "$NOTES_FROM_UNRELEASED_CLEAN" != "- Pending" ]; then
            NOTES_FORMATTED="$NOTES_FROM_UNRELEASED_CLEAN"
          elif [ -n "$NOTES_FROM_VERSION_CLEAN" ] && [ "$NOTES_FROM_VERSION_CLEAN" != "-" ]; then
            NOTES_FORMATTED="$NOTES_FROM_VERSION_CLEAN"
          else
            NOTES_FORMATTED="-"
          fi

          {
            echo "RESOLVED_RELEASE_NOTES<<EOF"
            echo "$NOTES_FORMATTED"
            echo "EOF"
          } >> "$GITHUB_ENV"

          # Plugin main file: update "Version: x.y.z" and const VERSION.
          sed -i -E "s/^([[:space:]]*\\*?[[:space:]]*)Version:[[:space:]]*.*/\\1Version: ${VERSION}/" class-relaypress-newsletter.php
          sed -i -E "s/^([[:space:]]*)const VERSION([[:space:]]*)=[[:space:]]*'[^']*';/\\1const VERSION\\2= '${VERSION}';/" class-relaypress-newsletter.php

          # WP readme stable tag
          if [ -f readme.txt ]; then
            sed -i -E "s/^Stable tag:\\s*.*/Stable tag: ${VERSION}/" readme.txt
          fi

          # Translation files project version
          if [ -d languages ]; then
            for file in languages/*.po languages/*.pot; do
              if [ -f "$file" ]; then
                sed -i -E "s/^\"Project-Id-Version: .*\"/\"Project-Id-Version: RelayPress ${VERSION}\"/" "$file"
              fi
            done
          fi

          # Compile MO files from PO (requires msgfmt)
          if ! command -v msgfmt >/dev/null 2>&1; then
            echo "msgfmt not available; install gettext to compile .mo files."
            exit 1
          fi
          for file in languages/*.po; do
            if [ -f "$file" ]; then
              msgfmt "$file" -o "${file%.po}.mo"
            fi
          done

          # Changelog: reuse Unreleased notes for version and keep Unreleased at top
          if [ -f CHANGELOG.md ]; then
            HEADER=$(head -n1 CHANGELOG.md)
            if [ "$HEADER" != "# Changelog" ]; then
              HEADER="# Changelog"
            fi

            awk -v ver="${VERSION}" '
              BEGIN{skip=0}
              NR==1 {next}
              $0=="## Unreleased"{skip=1; next}
              skip==1 && /^## /{skip=0}
              skip==1{next}
              $0=="## " ver {skip=1; next}
              skip==1 && /^## /{skip=0}
              skip==1{next}
              {print}
            ' CHANGELOG.md > CHANGELOG.body

            {
              echo "$HEADER"
              echo ""
              echo "## Unreleased"
              echo "- Pending"
              echo ""
              echo "## ${VERSION}"
              echo "$NOTES_FORMATTED"
              echo ""
              cat CHANGELOG.body
            } > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md
            rm -f CHANGELOG.body
          fi

          # Mirror CHANGELOG.md into readme.txt (WP format)
          if [ -f CHANGELOG.md ] && [ -f readme.txt ]; then
            CHANGELOG_BLOCK=$(awk '
              /^## / {
                title=substr($0, 4)
                print "= " title " ="
                next
              }
              {
                print
              }
            ' CHANGELOG.md | awk '
              BEGIN{seen=0}
              /^= /{seen=1}
              seen==1{print}
            ')

            awk -v block="$CHANGELOG_BLOCK" '
              BEGIN{in_block=0}
              /^== Changelog ==/{
                print
                print block
                in_block=1
                next
              }
              in_block==1{
                if (/^== /) {
                  in_block=0
                  print
                }
                next
              }
              {print}
            ' readme.txt > readme.tmp && mv readme.tmp readme.txt
          fi

      - name: Commit bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git add class-relaypress-newsletter.php readme.txt CHANGELOG.md languages/*.po languages/*.pot languages/*.mo || true
          git commit -m "chore(release): v${VERSION}" || echo "No changes to commit"

      - name: Push release branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          BRANCH="release/v${VERSION}"
          git push origin "$BRANCH"

      - name: Create PR to main + PR back-merge to develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          BRANCH="release/v${VERSION}"

          # PR to main
          PR_MAIN_URL=$(gh pr create \
            --title "Release v${VERSION}" \
            --body "${{ env.RESOLVED_RELEASE_NOTES }}" \
            --base main \
            --head "$BRANCH" \
            || true)

          echo "PR to main: $PR_MAIN_URL"

          # PR back to develop (optional but recommended)
          PR_DEV_URL=$(gh pr create \
            --title "Back-merge release v${VERSION} into develop" \
            --body "GitFlow back-merge." \
            --base develop \
            --head "$BRANCH" \
            || true)

          echo "PR to develop: $PR_DEV_URL"

      - name: Merge PR into main (requires repo permissions / branch rules)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          # Find PR number for release branch -> main
          PR_NUMBER=$(gh pr list --state open --head "release/v${VERSION}" --base main --json number -q '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR to main found. Aborting."
            exit 1
          fi

          # Merge (can fail if branch protection blocks)
          gh pr merge "$PR_NUMBER" --merge

      - name: Merge PR back into develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          PR_NUMBER=$(gh pr list --state open --head "release/v${VERSION}" --base develop --json number -q '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR to develop found. Skipping."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --merge

      - name: Delete release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          BRANCH="release/v${VERSION}"
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${BRANCH}" || true

      - name: Tag main
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git fetch origin main
          git checkout main
          git pull origin main
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Build ZIP (git archive) from tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          # Build a plugin folder inside zip with correct slug name
          git archive --format=zip --prefix=relaypress-newsletter/ "v${VERSION}" -o "dist/relaypress-newsletter-v${VERSION}.zip"

      - name: Create GitHub Release + upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body: ${{ env.RESOLVED_RELEASE_NOTES }}
          files: dist/relaypress-newsletter-v${{ inputs.version }}.zip
